[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/plato",
  "crates/emulator",
  "crates/importer",
  "crates/fetcher",
]

[profile.release]
# Whole-program optimization: inlines across crates (libremarkable, image
# code) and lets the pixel loops vectorize.
lto = "fat"
codegen-units = 1

[profile.release-minsized]
inherits = "release"
panic = "abort"
codegen-units = 1
opt-level = "z"
lto = true
strip = true
